<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热点详情 · 热门时事真伪辨别</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container brand-row">
      <h1 class="brand">
        <a class="brand-link" href="index.html#/board">
          <span class="brand-logo" aria-hidden="true">真</span>
          <span class="brand-name">热门时事真伪辨别</span>
        </a>
      </h1>
      <a class="avatar-btn" href="mine.html" aria-label="进入个人主页" title="个人主页">创</a>
    </div>
  </header>

  <main class="container">
    <!-- 面包屑：随时告诉用户「我现在在哪一层」；第一项同时承担返回首页的职责 -->
    <nav class="breadcrumb" aria-label="面包屑">
      <a class="back-link" href="index.html">← 返回首页</a>
      <span class="crumb-sep" aria-hidden="true">›</span>
      <span aria-current="page">核查详情</span>
    </nav>

    <!-- 核查档案头部：标题 + 结论标签 + 更新日期（由 detail.js 按「加载中 / 正常 / 空 / 错误」四种状态渲染） -->
    <section id="detail-head" class="detail-head"></section>

    <!-- 溯源时间线（F1） -->
    <section id="section-timeline" class="detail-section" hidden>
      <h2>溯源时间线</h2>
      <div id="timeline" class="timeline"></div>
    </section>

    <!-- 信源比对（F2） -->
    <section id="section-sources" class="detail-section" hidden>
      <h2>信源比对</h2>
      <!-- 信源关键词筛选（按信源名 + 域名匹配，清空恢复全部） -->
      <input type="search" id="source-search" class="filter-search"
             placeholder="输入关键词筛选信源…" aria-label="按关键词筛选信源">
      <p class="filter-summary" id="source-summary" aria-live="polite">共 0 条信源</p>
      <div id="source-cards" class="source-cards"></div>
      <p id="cross-check" class="cross-check"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>本站是帮助用户自查的辅助工具，不是下结论的判官 · 数据人工整理 · 每条信源可点开验证</p>
      <div class="footer-links">
        <a href="mine.html">个人主页</a>
        <a href="mine.html#about">判断方法</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
