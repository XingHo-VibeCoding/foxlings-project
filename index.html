<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热门时事真伪辨别 · 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">🔍 热门时事真伪辨别</h1>
      <p class="site-slogan">证据整理员，不是审判官 —— 每个结论都有信源可查</p>
    </div>
  </header>

  <main class="container">
    <!-- 视图切换：卡片流（默认） / 辟谣榜 -->
    <nav class="view-tabs" id="view-tabs">
      <button class="tab active" data-view="feed">热点卡片流</button>
      <button class="tab" data-view="board">辟谣榜</button>
      <button class="tab" data-view="favs">我的收藏</button>
    </nav>

    <!-- 视图一：热点卡片流 -->
    <section id="view-feed" class="view active" aria-label="热点卡片流">
      <!-- Day 12：结论筛选器（全部/真/假/部分属实/存疑），纯前端本地筛选 -->
      <div class="filter-bar" id="verdict-filter" role="group" aria-label="按核查结论筛选">
        <button type="button" class="chip active" data-verdict="all" aria-pressed="true">全部</button>
        <button type="button" class="chip" data-verdict="真" aria-pressed="false">真</button>
        <button type="button" class="chip" data-verdict="假" aria-pressed="false">假</button>
        <button type="button" class="chip" data-verdict="部分属实" aria-pressed="false">部分属实</button>
        <button type="button" class="chip" data-verdict="存疑" aria-pressed="false">存疑</button>
      </div>
      <!-- Day 12 延伸：关键词筛选，与结论筛选叠加生效（输入即过滤，清空即恢复全量） -->
      <input type="search" id="feed-search" class="filter-search"
             placeholder="输入关键词筛选标题或摘要…" aria-label="按关键词筛选热点卡片">
      <p class="filter-summary" id="filter-summary" aria-live="polite">共 0 条</p>
      <div id="card-list" class="card-list"></div>
    </section>

    <!-- 视图二：辟谣榜（日/周/月/年 + 检索，第 3 步实现） -->
    <section id="view-board" class="view" aria-label="辟谣榜">
      <div class="board-toolbar">
        <div class="board-tabs" id="board-tabs">
          <button class="tab active" data-range="day">日榜</button>
          <button class="tab" data-range="week">周榜</button>
          <button class="tab" data-range="month">月榜</button>
          <button class="tab" data-range="year">年榜</button>
        </div>
        <input type="search" id="board-search" class="board-search" placeholder="输入关键词检索…">
      </div>
      <div id="board-list" class="card-list"></div>
    </section>

    <!-- 视图三：我的收藏（读详情页的收藏记录；结论筛选 + 关键词筛选叠加生效） -->
    <section id="view-favs" class="view" aria-label="我的收藏">
      <div class="filter-bar" id="fav-verdict-filter" role="group" aria-label="按核查结论筛选收藏">
        <button type="button" class="chip active" data-verdict="all" aria-pressed="true">全部</button>
        <button type="button" class="chip" data-verdict="真" aria-pressed="false">真</button>
        <button type="button" class="chip" data-verdict="假" aria-pressed="false">假</button>
        <button type="button" class="chip" data-verdict="部分属实" aria-pressed="false">部分属实</button>
        <button type="button" class="chip" data-verdict="存疑" aria-pressed="false">存疑</button>
      </div>
      <input type="search" id="fav-search" class="filter-search"
             placeholder="输入关键词筛选收藏…" aria-label="按关键词筛选收藏">
      <p class="filter-summary" id="fav-summary" aria-live="polite">共 0 条</p>
      <div id="fav-list" class="card-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>本站是帮助用户自查的辅助工具，不是下结论的判官 · 数据人工整理 · 每条信源可点开验证</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
